<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- AI model optimisation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TalkSharp",
        "url": "https://talksharp.co/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "TalkSharp is an online language learning platform offering lessons in African languages including Yoruba, Igbo, Twi, Swahili, Nigerian Pidgin and many more",
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free access to selected language learning lessons"
        }
      }
    </script>

    <!-- Default SEO -->
    <title>TalkSharp | Learn African Languages Online</title>

    <meta
      name="description"
      content="Learn Yoruba, Igbo, Twi, Swahili and Nigerian Pidgin with TalkSharp. Explore interactive lessons, real-life conversations and African culture."
    />

    <!-- Default Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="TalkSharp | Learn African Languages Online"
    />

    <meta
      property="og:description"
      content="Discover a better way to learn African languages with interactive lessons and real-life conversations."
    />

    <meta
      property="og:image"
      content="https://talksharp.co/og-image.png"
    />

    <meta
      property="og:url"
      content="https://talksharp.co/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:image"
      content="https://talksharp.co/og-image.png"
    />
  </head>
  
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
